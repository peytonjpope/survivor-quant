name: Weekly survivor pick

on:
  schedule:
    # Tuesday ~8am ET. GitHub Actions cron is fixed UTC, so this drifts to
    # ~7am ET once daylight saving ends in November - still "morning ET",
    # not worth a second cron entry to correct.
    - cron: "0 12 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Compute pick and email it
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          python -m survivor.recommend \
            --season 2026 \
            --state state/season_2026.json \
            --send-email

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/season_2026.json
          git diff --cached --quiet || git commit -m "Record week's survivor pick"
          git push
